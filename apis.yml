description: >-
  BNY Mellon is a global investments company providing asset servicing, asset management, wealth management, treasury
  services, and clearance and collateral management for institutions and individuals. The BNY Mellon Marketplace
  (marketplace.bnymellon.com) and developer portal (developer.bny.com) provide Treasury Services APIs for corporate
  clients to automate payments, account management, balance reporting, and funds transfers.
